[project]
name = "sonique"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.119.0",
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.37.0",
    "yt-dlp>=2025.10.14",
]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
warn_return_any = true
show_error_codes = true
ignore_missing_imports = true